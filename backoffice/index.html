<!doctype html>
<!-- La interfaz está en inglés; el sitio público sigue en castellano y tiene su
     propio index.html. Sin esto el lector de pantalla lee «Check-in» con fonética
     castellana y Chrome ofrece traducir una página que ya está en inglés. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/SWC-logo.png" />
    <!-- `viewport-fit=cover` + `user-scalable=no`: es una herramienta que se usa
         parada y con una mano. Un zoom accidental en la fila de la puerta es
         tiempo perdido. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020618" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/outfit-latin.woff2" />

    <title>Backoffice · Startup World Cup Argentina</title>
    <!-- Herramienta interna: que no la indexe nadie. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="backoffice"></div>
    <script type="module" src="/backoffice/src/main.tsx"></script>
  </body>
</html>
