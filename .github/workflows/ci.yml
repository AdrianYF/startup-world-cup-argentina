# Lo mínimo para que no se despliegue algo roto.
#
# Hasta ahora la única verificación automática era que el build de Vercel saliera,
# y eso no mira ni los tipos ni el linter ni que `api/` cargue en Node.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Antes que nada: `acreditar.js` importa el `.js` generado del template de
      # mail, así que sin esto no carga ni el guardia ni los tests.
      - name: Compilar los templates de mail
        run: npm run build:emails

      # La más importante y la más barata: que api/ siga entrando en el plan
      # Hobby de Vercel y que sus 12 funciones carguen en Node pelado. Pasarse
      # del tope no da error en ningún lado — simplemente el deploy no sale.
      - name: api/ desplegable
        run: npm run guardia:api

      - name: Tipos
        run: npm run typecheck

      - name: Linter
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
